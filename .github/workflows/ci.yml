name: 持续集成

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: 生成两个架构共用的 CI 版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      published_at: ${{ steps.metadata.outputs.published_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 生成构建元数据
        id: metadata
        run: python3 scripts/versioning.py --commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  # 两个架构各自在**原生** runner 上运行。arm64 使用 GitHub 托管的 arm64
  # runner，因此走真实 PTY 的集成测试是在 arm64 上真正执行，
  # 而不是"交叉编译完就不验证"。
  test:
    needs: metadata
    name: ${{ matrix.arch }} 静态检查、测试与产物
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
            runner: ubuntu-latest
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 项目无第三方依赖，不需要模块缓存。
          cache: false

      - name: 静态检查
        run: go vet ./...

      - name: 安装前端测试运行时
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Web 配置草稿测试
        run: node --test test/*.test.mjs

      - name: 单元与集成测试
        # 含 internal/sim/bus_test.go 中走真实 PTY 的用例。
        run: go test -race ./...

      - name: 发布与自动更新工具测试
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 网页更新状态与操作测试
        run: node --test test/web_update_panel.test.mjs

      - name: 构建 linux 产物
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          BUILD_TIME: ${{ needs.metadata.outputs.published_at }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.buildTime=$BUILD_TIME" -o dist/slavesim-linux-${{ matrix.goarch }} .
          go build -trimpath -ldflags "-s -w" -o dist/probe-linux-${{ matrix.goarch }} ./cmd/probe
          dist/slavesim-linux-${{ matrix.goarch }} -version
          ls -l dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: slavesim-linux-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  # 验证镜像的交叉构建路径：在 x64 runner 上直接产出 linux/arm64 镜像。
  # 运行阶段采用目标架构的 Python 基础镜像且无 RUN 指令，不需要 qemu。
  docker-cross:
    needs: metadata
    name: 镜像交叉构建（linux/arm64）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 构建 arm64 镜像
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          BUILD_TIME: ${{ needs.metadata.outputs.published_at }}
        run: docker build --platform linux/arm64 --build-arg "VERSION=$VERSION" --build-arg "COMMIT=$COMMIT" --build-arg "BUILD_TIME=$BUILD_TIME" -t slavesim:arm64 .

      - name: 校验镜像架构与内容
        run: |
          arch="$(docker image inspect slavesim:arm64 --format '{{.Architecture}}')"
          echo "镜像架构: ${arch}"
          test "${arch}" = "arm64" || { echo "镜像架构不是 arm64"; exit 1; }
          docker create --name slavesim-check slavesim:arm64
          docker export slavesim-check | tar -tv | grep -E 'slavesim|/probe'
          docker rm slavesim-check
